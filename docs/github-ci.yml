# Optional CI. To enable: GitHub → Add file → Create new file →
# name it .github/workflows/ci.yml and paste this content.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/00_local_auth_stub.sql \
            -f supabase/migrations/0001_init.sql \
            -f supabase/migrations/0002_app_api.sql \
            -f supabase/migrations/0003_settings_seed.sql \
            -f supabase/tests/rls_test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run live-mode integration tests
        env:
          PGPASSWORD: postgres
          LIVE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:live
